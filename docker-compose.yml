name: ai-resume-toolkit

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env                     # copy .env.example → .env and fill in your keys
    volumes:
      - resume_uploads:/app/uploads
      - resume_chroma:/app/chroma_db
      - resume_db:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/provider-info')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  resume_uploads:
  resume_chroma:
  resume_db:
