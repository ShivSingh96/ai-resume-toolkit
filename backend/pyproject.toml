[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-resume-toolkit-backend"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    # Core API
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",

    # Document processing
    "PyMuPDF>=1.21.1",
    "python-docx>=0.8.11",

    # HTTP
    "requests>=2.28.2",
    "httpx>=0.27.0",

    # LLM providers (each imported only when its provider is selected)
    "groq>=0.9.0",
    "google-generativeai>=0.7.0",
    "openai>=1.30.0",
    "anthropic>=0.25.0",

    # Vector database — built-in ONNX embeddings, no PyTorch required
    "chromadb>=0.5.0",

    # Cloud persistence
    "supabase>=2.0.0",

    # Utilities
    "numpy>=1.24.3",
]

[tool.hatch.build.targets.wheel]
include = ["*.py"]
